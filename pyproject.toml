[project]
name = "tolmach"
version = "0.1.0"
description = "Telegram bot that translates forwarded posts to your language at your CEFR level."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot>=21.6",
    "openai>=1.40",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
tolmach = "bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.11",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

# ---------------------------------------------------------------------------
# uv resolver settings — checked into the repo so local dev and CI resolve
# under the same constraints. Bump the date when you want to pull in newer
# upstream releases (and commit the new uv.lock).
# ---------------------------------------------------------------------------
[tool.uv]
exclude-newer = "7 days"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter, `ALL` ruleset with documented ignores.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts — Ruff itself recommends disabling these when using
    # `ruff format` (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules).
    "COM812", # trailing comma enforced by the formatter, not the linter
    "ISC001", # implicit string concatenation handled by the formatter
    # Mutually-exclusive pydocstyle rules — you must pick one of each pair.
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the whole point of a test
    "PLR2004", # "magic" literals are expected in test assertions
    "S106",    # hardcoded dummy tokens/secrets are fine in tests
    "S105",    # ditto, when a dummy secret is compared in an assertion
    "ARG",     # fakes/fixtures mirror real signatures, leaving some args unused
    "SLF001",  # tests legitimately reach into internals
    "D",       # docstrings are not required on tests, fixtures, and fakes
    "TC",      # deferred-import / quoted-cast placement is noise in a test suite
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy — strict mode over both the package and the tests.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["bot", "tests"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# pytest + coverage.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=bot --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["bot"]
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
